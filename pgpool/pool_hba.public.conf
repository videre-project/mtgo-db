# "local" is for Unix domain socket connections only.
local   all             all                                     trust

# Public SQL access is intentionally passwordless, but only for the bounded
# read-only public_api role.
host    all             public_api      0.0.0.0/0               trust
host    all             public_api      ::/0                    trust

# Do not allow public tunnel traffic to choose the first-party api role.
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
