# "local" is for Unix domain socket connections only
local   all             all                                     trust
# IPv4 local connections:
host    all             all             127.0.0.1/32            trust
# Allow passwordless public read-only SQL access through Cloudflare Tunnel.
# The public_api database role owns read-only/timeout/resource guardrails.
host    all             public_api      0.0.0.0/0               trust
# First-party service role uses password auth so public traffic cannot bypass
# the stricter public_api limits by choosing the Worker-facing login.
host    all             api             0.0.0.0/0               password
# All other users require password
host    all             all             0.0.0.0/0               scram-sha-256
# IPv6 local connections:
host    all             all             ::1/128                 trust
