# "local" is for Unix domain socket connections only.
local   all             all                                     trust

# First-party Worker/API traffic must authenticate as the api role.
# Pgpool's password method uses the client-supplied password and does not
# consult pool_passwd.
host    all             api             0.0.0.0/0               password
host    all             api             ::/0                    password

# Keep public_api out of the Worker-only pool.
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
