[databases]

; PgBouncer authenticates the private api role, then forwards it to Pgpool.
; The upstream password is supplied through DATABASE_URL at container start.
mtgo = host=pgpool-internal port=9999

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; The Worker path is protected by Cloudflare Access and Pgpool still enforces
; the api role. Pgpool's internal HBA uses password authentication, so the
; private pool carries that credential through the protected Docker path.
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; Each API request uses a short-lived transaction. Released server sessions
; can therefore serve another Worker connection immediately.
pool_mode = transaction
max_client_conn = 512
default_pool_size = 32
max_db_connections = 32
max_user_connections = 32
; postgres.js uses prepared statements by default. Keep them available when a
; transaction is assigned to a different pooled server session.
max_prepared_statements = 100

; Keep requests bounded when all Pgpool sessions are busy. The Worker handler
; has a fifteen-second request deadline, so this leaves room for response and
; socket teardown after a queued request is assigned a server session.
query_wait_timeout = 14
server_connect_timeout = 10
server_login_retry = 1
server_idle_timeout = 300

; Keep the pooler observable without logging SQL text or credentials.
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60
