tunnel: ${CLOUDFLARED_TUNNEL_ID}
credentials-file: /etc/cloudflared/${CLOUDFLARED_TUNNEL_ID}.json
ingress:
  - hostname: ${CLOUDFLARED_PUBLIC_HOSTNAME}
    service: tcp://pgpool-public:9999
  - hostname: ${CLOUDFLARED_WORKER_HOSTNAME}
    service: tcp://pgbouncer-internal:6432
  - service: http_status:404
